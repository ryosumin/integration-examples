apply plugin: 'com.android.application'

repositories {
    flatDir {
        dirs 'libs'
    }
}

android {
    compileSdkVersion 35
    namespace 'com.tpcstld.twozerogame'

    defaultConfig {
        minSdkVersion 26
        targetSdkVersion 34
        versionCode 28
        versionName "1.1.11"

        multiDexEnabled true
        multiDexKeepProguard file('multidex-keep.txt')

        ndk {
            abiFilters "armeabi-v7a", "x86", "arm64-v8a", "x86_64"
        }
    }

    dexOptions {
        javaMaxHeapSize "4g"
    }

    lintOptions {
        abortOnError false
    }

    buildTypes {
        debug {
            jniDebuggable true
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-user.txt'
        }
        release {
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-user.txt'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    repositories {
        maven {
            url "https://nexus.skillz.com/content/groups/public/"
        }
        maven { url 'https://jitpack.io' }
        maven { url 'https://maven.singular.net' }
    }
    
    packagingOptions {
        resources {
            excludes += [
                'META-INF/DEPENDENCIES',
                'META-INF/LICENSE',
                'META-INF/LICENSE.txt',
                'META-INF/license.txt',
                'META-INF/NOTICE',
                'META-INF/NOTICE.txt',
                'META-INF/notice.txt',
                'META-INF/ASL2.0'
            ]
        }
    }
}

dependencies {
    //implementation 'com.android.support:multidex:2.0.0'
    implementation (name:'library-0.19.0', ext:'aar')
    implementation (name:'lottie-2.5.6', ext:'aar')
    implementation (name:'lottie-react-native-skillz-2.6.2', ext:'aar')
    implementation (name:'picasso-2.71828', ext:'aar')
    implementation (name:'SwipeRevealLayout-1.4.0', ext:'aar')
    implementation (name:'tracker-3.11.0', ext:'aar')
    implementation ('com.google.android.gms:play-services-ads:24.8.0')
    implementation ('com.skillz.sdk:skillz-sdk-android:2025.0.50'){
      exclude group: "com.airbnb.android", module: "lottie-react-native-skillz"
      exclude group: "com.airbnb.android", module: "lottie"
      exclude group: "com.github.tiagohm.MarkdownView", module: "library"
      exclude group: "com.squareup.picasso", module: "picasso"
      exclude group: "com.github.chthai64", module: "SwipeRevealLayout"
      exclude group: "com.kochava.base", module: "tracker"
      exclude group: "com.google.android.gms", module: "play-services-ads"
    }
}
