apply plugin: 'com.android.application'

android {
    compileSdkVersion 34
    namespace 'com.tpcstld.twozerogame'

    defaultConfig {
        minSdkVersion 26
        targetSdkVersion 34
        versionCode 28
        versionName "1.1.11"

        multiDexEnabled true
        multiDexKeepProguard file('multidex-keep.txt')

        ndk {
            abiFilters "armeabi-v7a", "x86", "arm64-v8a", "x86_64"
        }
    }

    dexOptions {
        javaMaxHeapSize "4g"
    }

    lintOptions {
        abortOnError false
    }

    buildTypes {
        debug {
            jniDebuggable true
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-user.txt'
        }
        release {
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-user.txt'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    repositories {
        maven {
            url "https://nexus.skillz.com/content/groups/public/"
        }
        maven { url 'https://jitpack.io' }
        maven { url 'https://maven.singular.net' }
    }
    
    packagingOptions {
        resources {
            excludes += [
                'META-INF/DEPENDENCIES',
                'META-INF/LICENSE',
                'META-INF/LICENSE.txt',
                'META-INF/license.txt',
                'META-INF/NOTICE',
                'META-INF/NOTICE.txt',
                'META-INF/notice.txt',
                'META-INF/ASL2.0'
            ]
        }
    }
}

dependencies {
    implementation 'com.android.support:multidex:2.0.0'
    implementation 'com.skillz.sdk:skillz-sdk-android:2025.0.50'
}
